<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="design_doc_mode" content="canvas" />
<title>forin Notebook - Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Mono:wght@700&display=swap" rel="stylesheet" />
<style>
body { margin: 0; }
a { color: #3E362B; } a:hover { color: #C75146; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="forin-notebook.jsx"></script>
<script type="text/babel" src="forin-notebook-profile.jsx"></script>
<script type="text/babel">
function NbProfileApp() {
  return (
    <DesignCanvas>
      <DCSection id="nb-me" title="forin Notebook — 프로필(나) & 성장 리포트" subtitle="사원증 · 커리어 패스 · 칭호 · 히든 미션 · 설정 / 달력 리포트 (스티커보드·연속스트립 제거)">
        <DCArtboard eager={true} id="nb-me-main" label="A · 프로필 (나)" width={402} height={874}><window.ProfileScrapbook/></DCArtboard>
        <DCArtboard eager={true} id="nb-me-growth" label="B · 성장 리포트 (달력)" width={402} height={874}><window.GrowthScrapbook/></DCArtboard>
        <DCArtboard eager={true} id="nb-me-add" label="C · 동료 추가 (초대 코드)" width={402} height={874}><window.ColleagueAddScrapbook/></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<NbProfileApp/>);
</script>
</body>
</html>
