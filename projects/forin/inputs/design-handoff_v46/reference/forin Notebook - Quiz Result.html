<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="design_doc_mode" content="canvas" />
<title>forin Notebook - Quiz & Result</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>body { margin: 0; } a { color: #3E362B; } a:hover { color: #C75146; }</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="forin-notebook.jsx"></script>
<script type="text/babel" src="forin-notebook-ui.jsx"></script>
<script type="text/babel" src="forin-notebook-session.jsx"></script>
<script type="text/babel" src="forin-notebook-quiz2.jsx"></script>
<script type="text/babel" src="forin-notebook-quiz3.jsx"></script>
<script type="text/babel">
function NbSessionApp() {
  return (
    <DesignCanvas>
      <DCSection id="nb-session" title="forin Notebook — 퀴즈 · 결과 · 복습 세션" subtitle="6가지 퀴즈 유형(잇기·받아쓰기·문장완성·객관식·순서·체크) + 근무 완료 도장 + 플래시카드 SRS">
        <DCArtboard eager={true} id="nb-quiz-sentence" label="A · 퀴즈 — 문장 완성 (칩)" width={402} height={874}><window.QuizSentence/></DCArtboard>
        <DCArtboard eager={true} id="nb-quiz-match" label="B · 퀴즈 — 용어 잇기" width={402} height={874}><window.QuizMatch/></DCArtboard>
        <DCArtboard eager={true} id="nb-quiz-mcq" label="C · 퀴즈 — 객관식 (치료적 소통)" width={402} height={874}><window.QuizMCQ/></DCArtboard>
        <DCArtboard eager={true} id="nb-quiz-dict" label="D · 퀴즈 — 받아쓰기" width={402} height={874}><window.QuizDictation/></DCArtboard>
        <DCArtboard eager={true} id="nb-quiz-order" label="E · 퀴즈 — 순서 배열 (분만 단계)" width={402} height={874}><window.QuizOrder/></DCArtboard>
        <DCArtboard eager={true} id="nb-quiz-flags" label="F · 퀴즈 — 안전 체크 (조영 CT)" width={402} height={874}><window.QuizFlags/></DCArtboard>
        <DCArtboard eager={true} id="nb-quiz-vitals" label="G · 퀴즈 — 바이탈 라벨링 (ER)" width={402} height={874}><window.QuizVitalsNb/></DCArtboard>
        <DCArtboard eager={true} id="nb-quiz-triage" label="H · 퀴즈 — ESI 판정 도장 (ER)" width={402} height={874}><window.QuizTriageNb/></DCArtboard>
        <DCArtboard eager={true} id="nb-quiz-dosage" label="I · 퀴즈 — 용량 계산 연습장 (약국)" width={402} height={874}><window.QuizDosageNb/></DCArtboard>
        <DCArtboard eager={true} id="nb-quiz-anatomy" label="J · 퀴즈 — 신체부위 라벨링 (병동)" width={402} height={874}><window.QuizAnatomyNb/></DCArtboard>
        <DCArtboard eager={true} id="nb-quiz-apgar" label="K · 퀴즈 — APGAR 채점표 (NICU)" width={402} height={874}><window.QuizApgarNb/></DCArtboard>
        <DCArtboard eager={true} id="nb-quiz-error" label="L · 퀴즈 — 라벨 오류찾기 (약국)" width={402} height={874}><window.QuizErrorNb/></DCArtboard>
        <DCArtboard eager={true} id="nb-result" label="M · 결과 — 시나리오 클리어" width={402} height={874}><window.ResultNb/></DCArtboard>
        <DCArtboard eager={true} id="nb-review-session" label="N · 오늘의 복습 세션" width={402} height={874}><window.ReviewSessionNb/></DCArtboard>
      </DCSection>
      <DCSection id="nb-quiz-wards" title="forin Notebook — 병동 특화 퀴즈 II" subtitle="ICU·OR·분만실·소아과·정신과·재활·투석·내시경·정형외과·감염관리 — 병동마다 낼법한 실전 문제">
        <DCArtboard eager={true} id="nb-q3-vent" label="O · ICU — 벤트 알람 대응" width={402} height={874}><window.QuizVentAlarm/></DCArtboard>
        <DCArtboard eager={true} id="nb-q3-titr" label="P · ICU — 승압제 적정 게이지" width={402} height={874}><window.QuizTitration/></DCArtboard>
        <DCArtboard eager={true} id="nb-q3-inst" label="Q · OR — 수술 기구 매칭" width={402} height={874}><window.QuizInstruments/></DCArtboard>
        <DCArtboard eager={true} id="nb-q3-timeout" label="R · OR — 타임아웃 체크" width={402} height={874}><window.QuizTimeout/></DCArtboard>
        <DCArtboard eager={true} id="nb-q3-fhr" label="S · 분만실 — 태아 모니터 판독" width={402} height={874}><window.QuizFHR/></DCArtboard>
        <DCArtboard eager={true} id="nb-q3-plain" label="T · 소아과 — 쉬운 말로 바꾸기" width={402} height={874}><window.QuizPlainLang/></DCArtboard>
        <DCArtboard eager={true} id="nb-q3-risk" label="U · 정신과 — 위험 신호 선별" width={402} height={874}><window.QuizRiskFlags/></DCArtboard>
        <DCArtboard eager={true} id="nb-q3-transfer" label="V · 재활 — 이동 보조 순서" width={402} height={874}><window.QuizTransfer/></DCArtboard>
        <DCArtboard eager={true} id="nb-q3-fluid" label="W · 투석 — 수분 제거량 계산" width={402} height={874}><window.QuizFluidCalc/></DCArtboard>
        <DCArtboard eager={true} id="nb-q3-npo" label="X · 내시경 — NPO 안내 완성" width={402} height={874}><window.QuizNPO/></DCArtboard>
        <DCArtboard eager={true} id="nb-q3-cms" label="Y · 정형외과 — CMS 사정 판정" width={402} height={874}><window.QuizCMS/></DCArtboard>
        <DCArtboard eager={true} id="nb-q3-ppe" label="Z · 감염관리 — PPE 착용 순서" width={402} height={874}><window.QuizPPE/></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<NbSessionApp/>);
</script>
</body>
</html>
