<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="design_doc_mode" content="canvas"/>
<title>forin Notebook - App Icon</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Mono:wght@700&display=swap" rel="stylesheet"/>
<style>
body{margin:0;font-family:"Pretendard",sans-serif}
a{color:#3E362B}a:hover{color:#C75146}
.board{position:absolute;background:#FFFdf4;border:1px solid #E0D6C0;box-shadow:0 4px 14px rgba(62,54,43,.12);padding:22px 24px 18px}
.board h2{margin:0 0 14px;font-family:"Gaegu",cursive;font-size:22px;color:#3E362B;font-weight:400}
.row{display:flex;gap:26px;align-items:flex-end}
.cell{text-align:center}
.cell .cap{font-family:"Gaegu",cursive;font-size:14px;color:#9A8F7C;margin-top:8px}
.icon-lg{width:160px;height:160px;border-radius:36px;overflow:hidden;box-shadow:0 6px 16px rgba(62,54,43,.25);display:block}
.icon-sm{width:60px;height:60px;border-radius:14px;overflow:hidden;box-shadow:0 3px 8px rgba(62,54,43,.25);display:block;margin:0 auto}
</style>
</head>
<body>

<!-- 확정: A · 여권 커버 -->
<div class="board" style="left:40px;top:40px;box-shadow:0 4px 14px rgba(62,54,43,.12),0 0 0 3px #5F8D5A">
<h2>✔ 확정 · 여권 커버 — 스토어 원본 1024px</h2>
<div class="row">
<div class="cell">
<svg style="width:220px;height:220px;border-radius:49px;overflow:hidden;box-shadow:0 8px 20px rgba(62,54,43,.3);display:block" viewBox="0 0 1024 1024">
<rect width="1024" height="1024" fill="#2E4636"/>
<rect width="1024" height="1024" fill="url(#grainA)" opacity=".5"/>
<defs>
<radialGradient id="vinA" cx=".5" cy=".42" r=".75"><stop offset=".55" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(0,0,0,.28)"/></radialGradient>
<pattern id="grainA" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="none"/><circle cx="1.5" cy="2" r=".6" fill="rgba(0,0,0,.05)"/><circle cx="4.5" cy="5" r=".5" fill="rgba(255,255,255,.03)"/></pattern>
</defs>
<rect width="1024" height="1024" fill="url(#vinA)"/>
<rect x="118" y="100" width="788" height="824" fill="none" stroke="rgba(212,180,106,.85)" stroke-width="14"/>
<rect x="140" y="122" width="744" height="780" fill="none" stroke="rgba(212,180,106,.4)" stroke-width="5"/>
<circle cx="512" cy="462" r="200" fill="none" stroke="#D4B46A" stroke-width="19"/>
<circle cx="512" cy="462" r="163" fill="none" stroke="rgba(212,180,106,.55)" stroke-width="9"/>
<text x="512" y="564" text-anchor="middle" font-family="Gaegu,cursive" font-size="330" fill="#D4B46A">f</text>
<text x="512" y="812" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="70" font-weight="700" letter-spacing="34" fill="#D4B46A">FORIN</text>
</svg>
<div class="cap">1024px 원본 (220px 표시)</div>
</div>
<div class="cell">
<svg class="icon-lg" viewBox="0 0 120 120">
<rect width="120" height="120" fill="#2E4636"/>
<rect x="14" y="12" width="92" height="96" fill="none" stroke="rgba(212,180,106,.85)" stroke-width="1.8"/>
<circle cx="60" cy="54" r="24" fill="none" stroke="#D4B46A" stroke-width="2.4"/>
<circle cx="60" cy="54" r="19.5" fill="none" stroke="rgba(212,180,106,.55)" stroke-width="1.2"/>
<text x="60" y="66" text-anchor="middle" font-family="Gaegu,cursive" font-size="40" fill="#D4B46A">f</text>
<text x="60" y="96" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8.5" font-weight="700" letter-spacing="4" fill="#D4B46A">FORIN</text>
</svg>
<div class="cap">중형 — 테두리+FORIN 유지</div>
</div>
<div class="cell">
<svg class="icon-sm" viewBox="0 0 120 120">
<rect width="120" height="120" fill="#2E4636"/>
<circle cx="60" cy="60" r="30" fill="none" stroke="#D4B46A" stroke-width="3.4"/>
<text x="60" y="76" text-anchor="middle" font-family="Gaegu,cursive" font-size="52" fill="#D4B46A">f</text>
</svg>
<div class="cap">소형 — 금장 f만</div>
</div>
</div>
</div>

<div class="cell">

<div class="cell">

<rect width="120" height="120" fill="#F1EBDD"/>

</g>

</svg>
<div class="cap">60px</div>
</div>

<div class="cell">
<svg class="icon-lg" viewBox="0 0 120 120">
<rect width="120" height="120" fill="#5F8D5A"/>

</g>
<rect x="44" y="20" width="34" height="13" fill="rgba(169,203,227,.75)" transform="rotate(-5 61 26)"/>

<div class="cell">
