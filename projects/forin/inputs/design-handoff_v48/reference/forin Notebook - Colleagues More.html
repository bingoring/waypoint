<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="design_doc_mode" content="canvas" />
<title>forin Notebook - Colleagues & More</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>body { margin: 0; } a { color: #3E362B; } a:hover { color: #C75146; }</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="forin-notebook.jsx"></script>
<script type="text/babel" src="forin-notebook-ui.jsx"></script>
<script type="text/babel" src="forin-notebook-social.jsx"></script>
<script type="text/babel">
function NbSocialApp() {
  return (
    <DesignCanvas>
      <DCSection id="nb-colleagues" title="forin Notebook — 동료" subtitle="코드로 맺기 · 함께 목표 · 현지 근무자 멘토 요청">
        <DCArtboard eager={true} id="nb-col-list" label="A · 동료 목록" width={402} height={874}><window.ColleaguesNb/></DCArtboard>
        <DCArtboard eager={true} id="nb-col-detail" label="B · 동료 상세 (현지 근무자)" width={402} height={874}><window.ColleagueDetailNb/></DCArtboard>
      </DCSection>
      <DCSection id="nb-misc" title="forin Notebook — 길찾기 · 스플래시 · 로그인" subtitle="손그림 약도 + 빨간펜 경로 · 여권 스플래시 · 필기란 로그인">
        <DCArtboard eager={true} id="nb-wayfind" label="C · 길찾기 (병원 약도)" width={402} height={874}><window.WayfindingNb/></DCArtboard>
        <DCArtboard eager={true} id="nb-splash" label="D · 스플래시" width={402} height={874}><window.SplashNb/></DCArtboard>
        <DCArtboard eager={true} id="nb-login" label="E · 로그인" width={402} height={874}><window.LoginNb/></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<NbSocialApp/>);
</script>
</body>
</html>
