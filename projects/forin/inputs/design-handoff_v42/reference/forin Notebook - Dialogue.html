<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="design_doc_mode" content="canvas" />
<title>forin Notebook - Dialogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Mono:wght@700&display=swap" rel="stylesheet" />
<style>
body { margin: 0; }
a { color: #3E362B; } a:hover { color: #C75146; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="forin-notebook.jsx"></script>
<script type="text/babel" src="forin-notebook-dialogue.jsx"></script>
<script type="text/babel">
function NbDialogueApp() {
  return (
    <DesignCanvas>
      <DCSection id="nb-dlg" title="forin Notebook — 상황 대화" subtitle="초상화 무대 · 영역 조절 손잡이 · 직접 말하기 / 보기 중 선택">
        <DCArtboard eager={true} id="nb-dlg-speak" label="A · 대화 (직접 말하기 · 2/2)" width={402} height={874}><window.DialogueSpeak/></DCArtboard>
        <DCArtboard eager={true} id="nb-dlg-opt" label="B · 대화 (보기 중 선택 · 1/2)" width={402} height={874}><window.DialogueOptions/></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<NbDialogueApp/>);
</script>
</body>
</html>
