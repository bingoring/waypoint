<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="design_doc_mode" content="canvas" />
<title>forin Notebook - Review Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
<style>
body { margin: 0; }
a { color: #3E362B; } a:hover { color: #C75146; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="forin-notebook.jsx"></script>
<script type="text/babel" src="forin-notebook-lab.jsx"></script>
<script type="text/babel">
function NbLabApp() {
  return (
    <DesignCanvas>
      <DCSection id="nb-lab" title="forin Notebook — 리뷰랩 (복습 노트)" subtitle="인덱스 탭 3분할 · 빨간펜 교정 + 형광펜 + SRS 4버튼">
        <DCArtboard eager={true} id="nb-lab-notes" label="A · 교정 노트 탭" width={402} height={874}><window.LabNotes/></DCArtboard>
        <DCArtboard eager={true} id="nb-lab-speak" label="B · 말하기 탭" width={402} height={874}><window.LabSpeak/></DCArtboard>
        <DCArtboard eager={true} id="nb-lab-model" label="C · 모범답안 탭" width={402} height={874}><window.LabModel/></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<NbLabApp/>);
</script>
</body>
</html>
