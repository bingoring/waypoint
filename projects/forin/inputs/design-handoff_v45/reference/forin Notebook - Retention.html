<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection id="nb-retention" title="forin Notebook — 리텐션 시스템" subtitle="죄책감 대신 구체적 이득 · 스트릭은 안전망 · 알림은 사용자 통제">
        <DCArtboard eager={true} id="nbr-push" label="A · 잠금화면 푸시 3종" width={402} height={874}><window.PushLock/></DCArtboard>
        <DCArtboard eager={true} id="nbr-streak" label="B · 스트릭 보호 (동결권·복구권·위기 모먼트)" width={402} height={874}><window.StreakGuard/></DCArtboard>
